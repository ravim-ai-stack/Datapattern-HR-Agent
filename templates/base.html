<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}DataPattern HR Automation Agent{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header class="app-header"><img src="{{ url_for('static', filename='img/datapattern-logo.png') }}" alt="DataPattern" class="app-logo"><h1>DataPattern HR Automation Agent</h1><p>Create, review and send professional employment letters</p></header>
<nav class="stepper stepper-four"><a class="step-item {{ 'active' if active_step == 1 else ('done' if active_step > 1 else '') }}" href="/step1"><span class="step-circle">1</span><span class="step-label">Letter Type</span></a><div class="step-line {{ 'filled' if active_step > 1 else '' }}"></div><a class="step-item {{ 'active' if active_step == 2 else ('done' if active_step > 2 else '') }}" href="/step2"><span class="step-circle">2</span><span class="step-label">Details</span></a><div class="step-line {{ 'filled' if active_step > 2 else '' }}"></div><a class="step-item {{ 'active' if active_step == 3 else ('done' if active_step > 3 else '') }}" href="/step3"><span class="step-circle">3</span><span class="step-label">Preview</span></a><div class="step-line {{ 'filled' if active_step > 3 else '' }}"></div><a class="step-item {{ 'active' if active_step == 4 else '' }}" href="/step4"><span class="step-circle">4</span><span class="step-label">Send</span></a></nav>
<main class="container"><div id="toast" class="toast hidden"></div>{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/common.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
