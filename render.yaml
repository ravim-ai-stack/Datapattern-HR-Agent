services:
  - type: web
    name: datapattern-hr-agent
    runtime: docker
    plan: free
    healthCheckPath: /step1
    envVars:
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: SYSTEM_SENDER_EMAIL
        sync: false
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_MODEL
        value: databricks-meta-llama-3-3-70b-instruct
